name: Render Methodology Report

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  render:
    name: Render public evidence reports
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Pin Python 3.13
        run: uv python install 3.13

      - name: Sync pinned gate runtime
        run: uv sync --frozen --python 3.13 --no-install-project --extra dev --extra report

      - name: Read pinned Quarto version
        id: quarto-version
        run: echo "version=$(<.quarto-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "${{ steps.quarto-version.outputs.version }}"

      - name: Run canonical merge gate
        run: uv run --frozen --no-sync bash scripts/run-merge-gate.sh

      - name: Upload rendered reports
        uses: actions/upload-artifact@v4
        with:
          name: methodology-report-html
          path: reports/rendered/**/*.html
          if-no-files-found: error
