version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Anchorage"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      routine-python-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Anchorage"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      routine-action-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
